[package]
name = "intl"
version = "0.5.6"
edition = "2024"
rust-version = "1.88"
description = "Pure-Rust, no_std internationalization primitives (a pure-Rust ICU analog). The `unicode` module provides General_Category, character predicates, scripts, East Asian Width, numeric values, case mapping/folding, UAX #15 normalization (NFC/NFD/NFKC/NFKD), and UTS #10 collation — property tables compiled into const-fn match lookups, with feature-selectable codepoint ranges."
repository = "https://github.com/KarpelesLab/intlrs"
license = "MIT"
readme = "README.md"
keywords = ["intl", "unicode", "no_std", "i18n", "ucd"]
categories = ["no-std", "internationalization", "text-processing"]
# Only ship generated Rust + the embedded CLDR/UCD `.bin` tables + sources; the
# multi-MB vendored UCD/CLDR data and the codegen tool are excluded.
include = [
    "src/**/*.rs",
    "src/cldr/*.bin",
    "src/unicode/*.bin",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[features]
# Batteries-included by default: the whole Unicode codepoint space (`full`),
# the allocating APIs (`alloc`), every Unicode algorithm component, the full
# character-name database (`names`), and the IANA time-zone database (`iana-tz`).
# All `no_std`. To shrink the build, opt out with `default-features = false` and
# enable only the range tier + components you need (see below).
default = [
    "full",
    "alloc",
    "names",
    "normalization",
    "segmentation",
    "bidi",
    "case",
    "identifiers",
    "collation",
    "idna",
    "confusables",
    "iana-tz",
    # CLDR formatters (each opt-out-able; see below).
    "number",
    "number-numsys",
    "number-range",
    "currency",
    "units",
    "units-narrow",
    "datetime",
    "calendars-extra",
    "displaynames",
    "list",
    "relative",
    "message",
    "spellout",
    "transliterate",
    "locale",
]

# --- Range tiers (opt out for size) -----------------------------------------
# Coarse, nested codepoint-range tiers. Selecting a tier compiles it and every
# smaller tier; codepoints outside the compiled range resolve to `Unassigned` (Cn).
ascii = []              # U+0000..=U+007F
latin1 = ["ascii"]      # U+0080..=U+00FF
bmp = ["latin1"]        # U+0100..=U+FFFF (rest of the Basic Multilingual Plane)
full = ["bmp"]          # U+10000..=U+10FFFF (supplementary planes)

# Allocation. Still `no_std`; enables APIs that need `alloc` (the formatters,
# `collate`, `idna`, …). Implies `full` because they operate over the whole
# codepoint space.
alloc = ["full"]

# --- Unicode algorithm components (opt out individually) --------------------
# Each gates both its module and its (large) generated table. The foundational
# property lookups — General_Category, predicates, scripts, East Asian Width,
# numeric values — are always available. Dependencies between components are
# expressed below (e.g. collation builds on case + normalization).
normalization = []                          # UAX #15 NFC/NFD/NFKC/NFKD
segmentation = []                           # UAX #29 grapheme/word/sentence + UAX #14 line
segmentation-dict = ["segmentation"]        # dictionary word segmentation for Thai (+ segment_dict.bin, ~149 KB); opt-in, not in default
segmentation-dict-cjk = ["segmentation-dict", "alloc", "normalization"] # + Chinese/Japanese Viterbi segmentation (+ segment_dict_cjk.bin, ~2.5 MB; needs alloc for the DP buffers, normalization for ICU's NFKC pre-fold of the run); opt-in, not in default
segmentation-dict-lao = ["segmentation-dict"] # + Lao segmentation (reuses the Thai engine; + segment_dict_lao.bin, ~180 KB); opt-in, not in default
segmentation-dict-km = ["segmentation-dict"] # + Khmer segmentation (reuses the Thai engine, U+1780-relative DAWG; + segment_dict_km.bin, 920 KB); opt-in, not in default
segmentation-dict-my = ["segmentation-dict"] # + Burmese/Myanmar segmentation (reuses the Thai engine, U+1000-relative DAWG, main block only; + segment_dict_my.bin, 553 KB); opt-in, not in default
bidi = []                                   # UAX #9 bidirectional algorithm
identifiers = []                            # UAX #31 identifiers
case = ["normalization", "segmentation"]    # case mapping/folding (needs NFD + word breaks)
collation = ["case", "alloc", "_cldr"]      # UTS #10 collation (~1.9 MB table; CLDR tailorings)
# Chinese (zh) collation — the default `Intl.Collator('zh')` pinyin order plus the
# `zh-u-co-stroke` / `zh-u-co-zhuyin` / `zh-u-co-unihan` variants. Adds four
# generated tables: collation_zh.bin (pinyin, ~122 KB), collation_zh_rs.bin
# (Unihan radical-stroke — the reading-less fallback AND the all-Han `unihan`
# order, now covering the whole URO, ~597 KB), collation_zh_stroke.bin (~123 KB)
# and collation_zh_zhuyin.bin (~122 KB) — ~964 KB total — plus a gated code path
# in `Tailoring`; opt-in, NOT in default. See `collate` docs.
collation-zh = ["collation"]                # zh Han-weight tables (pinyin/stroke/zhuyin + radical-stroke)
idna = ["normalization", "alloc", "bidi"]   # UTS #46 IDNA (bidi: CheckBidi / RFC 5893)
confusables = ["normalization", "alloc"]    # UTS #39 confusable/skeleton

# The full tabulated character `Name` database (`unicode::name`). Implies
# `alloc`. NOTE: embeds a ~1.3 MB name blob (`src/unicode/names.bin`) into the
# binary when enabled; the algorithmic `char_name` (Hangul/CJK/…) needs no data
# and is always available.
names = ["alloc"]

# --- CLDR formatters (opt out individually for size) ------------------------
# Each gates its module AND the CLDR table(s) it embeds — a `.bin` blob, or a
# generated Rust module under `src/cldr/generated/` — so a disabled
# formatter contributes no code or data. All imply `alloc` (except
# `displaynames`, which is borrow-only). `_cldr` is an internal marker enabling
# the shared CLDR data layer; do not select it directly. The always-available
# `plural` and `calendar` (arithmetic) modules need no feature and no data.
_cldr = []                                  # internal: shared CLDR reader + structs
number = ["alloc", "_cldr"]                 # decimal/percent/scientific/compact/ordinal/parse + NumberFormat
# The per-locale, non-`latn` numbering-system symbols and patterns (`ar`/`arab`,
# `fa`/`arabext`, `hi`/`deva`, …): ~4 KB of `#[cfg]`-ed match arms covering the 26
# locales CLDR ships a second block for. In `default` because without it a
# `-u-nu-…` request still transliterates the digits but silently keeps the
# locale's `latn` separators.
number-numsys = ["number"]
# ECMA-402 v3 `formatRange`/`formatRangeToParts` plus the CLDR `miscPatterns`
# (`approximately`, `range`) they need: ~16 KB of code + data. Gates the API as
# well as the data, so opting out is an explicit "I don't format ranges" rather
# than a silent downgrade; in `default` because the spec surface belongs there.
number-range = ["number"]
currency = ["number"]                       # currency formatting (+ ~0.9 MB currency.bin)
units = ["number"]                          # measurement units, long + short (+ ~857 KB generated)
# The narrow unit width (ECMA-402 `unitDisplay: "narrow"`, e.g. "5km"). Its match
# arms are a further ~357 KB of generated source, so they are `#[cfg]`-gated
# separately; in `default` because that tier is the spec-complete one and without
# it narrow silently degrades to short. Opt out via `default-features = false`.
units-narrow = ["units"]
datetime = ["number"]                       # date/time/skeleton + POSIX-TZ/GMT (+ calendar/skeletons.bin)
calendars-extra = ["datetime"]              # Islamic + Persian calendars (+ islamic/persian.bin)
displaynames = ["_cldr"]                    # Intl.DisplayNames (+ ~1.6 MB language/territory names)
# Intl.ListFormat, all nine ECMA-402 `type` × `style` combinations (~15 KB).
# CLDR ships the nine independently — `es` writes a unit list "a, b y c" where
# `en` writes "a, b, c" — so they cannot be derived from one another and are all
# carried. Interned into a shared arena, which is why nine sets cost ~1.5× what
# two used to.
list = ["alloc", "_cldr"]
# Intl.RelativeTimeFormat: eight units × three widths, both `numeric` modes
# (~243 KB, uses number for the count). The widths are independent CLDR blocks
# (`day` / `day-short` / `day-narrow`), so like `units-narrow` they are real data
# rather than a derivation — but at this size they are not worth their own
# feature, and dropping one would leave `style: "narrow"` silently rendering as
# long, which is a wrong answer rather than a coarser one.
relative = ["number"]
message = ["number"]                        # ICU MessageFormat (uses number + plural)
spellout = ["alloc", "_cldr"]               # RBNF spell-out (+ rbnf.bin)
transliterate = ["alloc", "normalization"]  # script transliteration
locale = ["alloc", "_cldr"]                 # BCP-47 + likely-subtags (+ likely.bin)

# --- Localized time-zone names (UTS #35 §4.8) -------------------------------
# `timeZoneName: "long"` → "Pacific Standard Time" rather than "GMT-08:00":
# CLDR's metazone names, exemplar cities and region formats for all 101 locales.
# Split one feature per tzdb area because the tables are large (~2.9 MB of
# generated source, +2.1 MB of compiled text+rodata for all eleven) and most
# applications need one or two areas; an area that is not compiled in falls back
# to the localized GMT offset, which is UTS #35's own last resort, so the result
# stays correct, just less specific. Measured `text+data` added per area:
# America +569 KB, Asia +561 KB, Pacific +270 KB, Europe +176 KB,
# Africa +131 KB, Antarctica +110 KB, Atlantic +98 KB, Australia +98 KB,
# Indian +65 KB, Arctic +20 KB, Etc +16 KB.
# NOT in `default`, unlike `units-narrow`. That a fallback is spec-sanctioned
# decides whether opting out is *safe*, not whether a table belongs in the
# default build, and 2.1 MB is still the largest single table in the crate —
# seven times `units-narrow`. Since the fallback here is a correct answer rather
# than a wrong one (a localized GMT offset, not a bad name), the size decides:
# enable `tz-names` for all eleven areas, or just the areas you serve. A consumer
# shipping over a network especially wants the latter — the full set measures
# ~0.55 MB gzipped in a WebAssembly build.
# The names themselves are stored as one deduplicated string arena per area plus
# sorted (key -> string) index arrays, not as `match` arms: at this width a match
# compiles to jump tables plus per-arm code to build each `&'static str`, which
# measured 4.4 MB for 1.5 MB of distinct strings. See `name_lookup` in
# `src/cldr/generated/tz_names.rs`.
tz-names = [
    "tz-names-africa",
    "tz-names-america",
    "tz-names-antarctica",
    "tz-names-arctic",
    "tz-names-asia",
    "tz-names-atlantic",
    "tz-names-australia",
    "tz-names-etc",
    "tz-names-europe",
    "tz-names-indian",
    "tz-names-pacific",
]
tz-names-africa = ["datetime"]          # Africa/… (53 zones)
tz-names-america = ["datetime"]         # America/… (153 zones)
tz-names-antarctica = ["datetime"]      # Antarctica/… (11 zones)
tz-names-arctic = ["datetime"]          # Arctic/… (1 zone)
tz-names-asia = ["datetime"]            # Asia/… (86 zones)
tz-names-atlantic = ["datetime"]        # Atlantic/… (11 zones)
tz-names-australia = ["datetime"]       # Australia/… (11 zones)
tz-names-etc = ["datetime"]             # Etc/… (29 offset pseudo-zones)
tz-names-europe = ["datetime"]          # Europe/… (59 zones)
tz-names-indian = ["datetime"]          # Indian/… (11 zones)
tz-names-pacific = ["datetime"]         # Pacific/… (41 zones)

# --- Time zones -------------------------------------------------------------
# Full IANA time-zone support via the embedded `timezone-data` crate (historical
# transitions, DST, abbreviations). Drives the `datetime` named-zone path.
# POSIX `TZ` rules and GMT offsets are available with `datetime` alone.
iana-tz = ["dep:timezone-data", "datetime"]

[dependencies]
# Optional: only pulled in by the `iana-tz` feature. no_std / no-alloc itself.
timezone-data = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "throughput"
harness = false
required-features = ["alloc"]

# This crate is intentionally NOT a cargo workspace. The `codegen/` directory is
# a standalone, packaging-time tool (its own independent package) that
# regenerates the committed tables under src/unicode/generated/ when the UCD
# data or Unicode version changes. It is never built, published, or versioned as
# part of `intl`. Run it with:
#   cargo run --manifest-path codegen/Cargo.toml
